{% extends 'core/base.html' %}

{% block title %}Delete Institution{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Delete Institution</h2>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete "{{ object.name }}"?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Yes, delete</button>
                            <a href="{% url 'core:institution_list' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
