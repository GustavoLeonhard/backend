{% extends "core/base.html" %}

{% block title %}Classes{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Classes</h1>
        <a href="{% url 'core:class_create' %}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Class
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Teacher</th>
                    <th>Subject</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for class in classes %}
                <tr>
                    <td>{{ class.name }}</td>
                    <td>{{ class.teacher }}</td>
                    <td>{{ class.subject }}</td>
                    <td>
                        <div class="btn-group" role="group">
                            <a href="{% url 'core:class_detail' class.pk %}" class="btn btn-info btn-sm">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a href="{% url 'core:class_update' class.pk %}" class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a href="{% url 'core:class_delete' class.pk %}" class="btn btn-danger btn-sm">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No classes found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
